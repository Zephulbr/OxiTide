[package]
name = "oxitide-connect-probe"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
publish = false
description = "Throwaway TIDAL Connect controller probe (spike for issue #11)"

# Standalone on purpose: the spike tool stays out of the root workspace, its
# Cargo.lock and its CI gates.
[workspace]

[dependencies]
anyhow = "1.0.105"
base64 = "0.22"
futures-util = "0.3.34"
keyring = { version = "3", features = ["windows-native"] }
mdns-sd = "0.22.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = { version = "1.16.0", features = ["std"] }
rustls-webpki = { version = "0.103.17", features = ["ring", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "time", "net", "sync", "signal", "io-util"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
