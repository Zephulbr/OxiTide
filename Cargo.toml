[workspace]
resolver = "2"
members = ["crates/oxitide-tidal", "crates/oxitide-audio", "crates/oxitide-app"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "net"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
url = "2"
quick-xml = "0.42"
symphonia = { version = "0.6", features = ["flac", "isomp4", "pcm", "aac"] }
rtrb = "0.4"
base64 = "0.22"
toml = "1"
directories = "6"
rand = "0.10"

# Track 7b: AutoMix analysis runs at track boundaries; keep the FFT/resampling
# crates fast in dev builds so `app:dev` does not underrun during a transition.
[profile.dev.package.rustfft]
opt-level = 3

[profile.dev.package.realfft]
opt-level = 3

[profile.dev.package.rubato]
opt-level = 3

# The analysis itself (onset envelope, beat tracking) lives in oxitide-audio;
# unoptimized it missed the tail almost every time in `app:dev` (2026-10-13).
[profile.dev.package.oxitide-audio]
opt-level = 2
