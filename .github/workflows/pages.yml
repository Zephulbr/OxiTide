name: Pages

# Publishes the showcase site (site/) to GitHub Pages as is: it is plain
# static files with no build step. The folder's own notes (README.md,
# PLAN.md) stay out of the published copy.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Stage the site
        run: |
          mkdir _site
          cp -r site/. _site/
          rm -f _site/*.md
      # Pages lets browsers keep files for 10 minutes, and a reload only asks
      # for the page again, not its styles and scripts: a phone kept showing
      # the old CSS after a deploy. Each deploy stamps its commit onto them.
      - name: Stamp the styles and scripts
        run: |
          v="${GITHUB_SHA::8}"
          sed -i -E "s#((href|src)=\"(styles|scripts)/[a-z]+\.(css|js))\"#\1?v=$v\"#g" _site/index.html
          grep -c "?v=$v" _site/index.html
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
