name: Release

# Push a tag vX.Y.Z (matching tauri.conf.json and Cargo.toml) to build a draft
# GitHub Release. Publishing the draft by hand is what exposes latest.json to
# installed copies. See docs/release.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check-version:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node --test scripts/release/release.test.mjs
      - run: node scripts/release/check-version.mjs "$GITHUB_REF_NAME"

  build:
    name: Build (${{ matrix.name }})
    needs: check-version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: Windows
            os: windows-latest
            artifacts: |
              target/release/bundle/nsis/*.exe
              target/release/bundle/nsis/*.exe.sig
              target/release/bundle/msi/*.msi
              target/release/bundle/msi/*.msi.sig
          - name: Linux
            os: ubuntu-22.04
            artifacts: |
              target/release/bundle/deb/*.deb
              target/release/bundle/appimage/*.AppImage
              target/release/bundle/appimage/*.AppImage.sig
    steps:
      - uses: actions/checkout@v5

      - name: Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl wget file pkg-config \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            libasound2-dev libasound2-plugins libdbus-1-dev \
            patchelf xdg-utils desktop-file-utils

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        run: npm --prefix ui ci

      - name: Build bundles
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm --prefix ui run app:build -- --config crates/oxitide-app/tauri.release.conf.json

      - uses: actions/upload-artifact@v5
        with:
          name: bundles-${{ runner.os }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Write manifest and checksums
        run: node scripts/release/make-manifest.mjs artifacts out "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY"

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t files < <(find artifacts -type f \( -name '*.exe' -o -name '*.msi' -o -name '*.deb' -o -name '*.AppImage' \))
          gh release create "$GITHUB_REF_NAME" \
            --draft --verify-tag \
            --title "OxiTide ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            "${files[@]}" out/latest.json out/SHA256SUMS.txt
