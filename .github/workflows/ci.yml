name: CI

on:
  push:
    # release/** is the 1.x maintenance line once V2 work starts on main.
    branches: [main, "release/**"]
  pull_request:
  # The release workflow runs these same gates on the tagged commit before it
  # builds anything (release.yml, job `gates`).
  workflow_call:
  # A manual run (Actions tab, or `gh workflow run CI --ref main`) for when
  # GitHub drops a push's run: on 2026-11-11 a run created during an Actions
  # incident stayed "queued" with no jobs and could be neither cancelled nor
  # re-run.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: Linux
            os: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl wget file pkg-config \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            libasound2-dev libasound2-plugins libdbus-1-dev \
            patchelf

      # The toolchain is pinned in rust-toolchain.toml (the one place it
      # lives), so a new stable's lints never turn CI red on unchanged code.
      - name: Read the pinned toolchain
        id: rust
        shell: bash
        run: echo "channel=$(sed -n 's/^channel *= *"\(.*\)".*/\1/p' rust-toolchain.toml | tr -d '\r')" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
          components: clippy, rustfmt

      # Needs no build (or ui/dist), so it fails fast.
      - name: Rustfmt
        run: cargo fmt --all -- --check

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        run: npm --prefix ui ci

      # tauri::generate_context! reads ui/dist at compile time, so the UI
      # must be built before any cargo step.
      - name: Build UI
        run: npm --prefix ui run build

      - name: UI type check
        run: npm --prefix ui run check

      - name: UI tests
        run: npm --prefix ui test

      # nextest's `ci` profile (.config/nextest.toml) retries a failed test
      # twice. A test that passes only on a retry is flaky: it is listed as a
      # warning on the run, and it still needs a fix.
      - name: Rust tests
        shell: bash
        run: |
          set -o pipefail
          cargo nextest run --workspace --profile ci 2>&1 | tee nextest.log
          # nextest prints each flaky test twice (inline and in the summary).
          flaky=$(sed 's/\x1b\[[0-9;]*m//g' nextest.log | grep -E '^\s*FLAKY ' | sed -E 's/^\s+//' | sort -u || true)
          if [ -n "$flaky" ]; then
            echo "### Flaky tests (passed on a retry)" >> "$GITHUB_STEP_SUMMARY"
            while IFS= read -r line; do
              echo "::warning title=Flaky test::$line"
              echo "- \`$line\`" >> "$GITHUB_STEP_SUMMARY"
            done <<< "$flaky"
          fi

      # nextest does not run doctests.
      - name: Rust doctests
        run: cargo test --workspace --doc

      # Test code included (--all-targets): its 22-warning backlog was cleared
      # on 2026-11-11 so it cannot build up again.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  scripts:
    name: Node scripts
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Release scripts
        run: node --test scripts/release/release.test.mjs
      - name: Perf checker
        run: node --test scripts/perf/check.test.mjs
