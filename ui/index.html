<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OxiTide</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      (function () {
        var t = "dark";
        try {
          t = localStorage.getItem("oxitide.theme") || "dark";
        } catch (e) {}
        if (t === "system") {
          if (window.matchMedia) {
            t = window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          } else {
            t = "dark";
          }
        } else if (t !== "dark" && t !== "light") {
          t = "dark";
        }
        // Mode and Studio tone mirror lib/theme.ts (MODE/TONE_STORAGE_KEY):
        // drawing the first frame in the saved look avoids a flash of the
        // default one. Unknown values are skipped; init reconciles.
        var m = null, tone = null;
        try {
          m = localStorage.getItem("oxitide.mode");
          tone = localStorage.getItem("oxitide.tone");
        } catch (e) {}
        var root = document.documentElement;
        root.dataset.theme = t;
        root.style.colorScheme = m === "rack" ? "dark" : t;
        if (m === "atmosphere" || m === "instrument" || m === "rack") root.dataset.mode = m;
        if (tone === "warm" || tone === "neutral" || tone === "black") root.dataset.tone = tone;
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
