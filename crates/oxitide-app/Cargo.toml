[package]
name = "oxitide-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
oxitide-tidal = { path = "../oxitide-tidal" }
oxitide-audio = { path = "../oxitide-audio" }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
toml.workspace = true
directories.workspace = true
thiserror.workspace = true
url.workspace = true
md-5 = "0.10"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
discord-rich-presence = "1.1"

[dev-dependencies]
wiremock = "0.6"

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
windows = { version = "0.62", features = [
    "Media",
    "Foundation",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_System_WinRT",
    "Win32_System_Com",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_Diagnostics_ToolHelp",
] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }
mpris-server = { version = "0.10", default-features = false, features = ["tokio"] }

# Unsupported platforms (macOS is out of scope per spec §2) keep keyring's
# featureless mock store so they still compile.
[target.'cfg(not(any(windows, target_os = "linux")))'.dependencies]
keyring = { version = "3" }
