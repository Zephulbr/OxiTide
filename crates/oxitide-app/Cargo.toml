[package]
name = "oxitide-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
oxitide-tidal = { path = "../oxitide-tidal" }
oxitide-audio = { path = "../oxitide-audio" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-global-shortcut = "2"
reqwest.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
tokio.workspace = true
tracing.workspace = true
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
toml.workspace = true
directories.workspace = true
thiserror.workspace = true
url.workspace = true
md-5 = "0.10"
base64.workspace = true
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
discord-rich-presence = "1.1"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "json"] }
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
sha2 = "0.10"
getrandom = "0.3"
futures-util = "0.3"
if-addrs = "0.15.0"
socket2 = "0.6"
tauri-plugin-updater = "2"

[dev-dependencies]
wiremock = "0.6"

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
# Same version wry uses, so Tauri's `PlatformWebview::controller()` type matches.
webview2-com = "0.39"
windows = { version = "0.62", features = [
    "Media",
    "Foundation",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_System_WinRT",
    "Win32_System_Com",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_Graphics_Gdi",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }
mpris-server = { version = "0.10", default-features = false, features = ["tokio"] }

# Unsupported platforms (macOS is out of scope per spec §2) keep keyring's
# featureless mock store so they still compile.
[target.'cfg(not(any(windows, target_os = "linux")))'.dependencies]
keyring = { version = "3" }
