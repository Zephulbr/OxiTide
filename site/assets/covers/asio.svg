<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
  <!-- "ASIO": a printed sleeve on bone card. Eight channels run straight from
       top to bottom, unbroken; one is lit. -->
  <rect width="600" height="600" fill="#e6dcc6"/>
  <g fill="#1b150e">
    <rect x="96" y="0" width="22" height="600"/>
    <rect x="152" y="0" width="22" height="600"/>
    <rect x="208" y="0" width="22" height="600"/>
    <rect x="320" y="0" width="22" height="600"/>
    <rect x="376" y="0" width="22" height="600"/>
    <rect x="432" y="0" width="22" height="600"/>
    <rect x="488" y="0" width="22" height="600"/>
  </g>
  <rect x="264" y="0" width="22" height="600" fill="#d9822b"/>
  <rect x="0" y="470" width="600" height="130" fill="#1b150e"/>
  <g fill="#e6dcc6">
    <rect x="96" y="520" width="22" height="30" rx="4"/>
    <rect x="152" y="520" width="22" height="30" rx="4"/>
    <rect x="208" y="520" width="22" height="30" rx="4"/>
    <rect x="320" y="520" width="22" height="30" rx="4"/>
    <rect x="376" y="520" width="22" height="30" rx="4"/>
    <rect x="432" y="520" width="22" height="30" rx="4"/>
    <rect x="488" y="520" width="22" height="30" rx="4"/>
  </g>
  <rect x="264" y="520" width="22" height="30" rx="4" fill="#d9822b"/>
</svg>
