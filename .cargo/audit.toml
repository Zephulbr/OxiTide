# cargo-audit settings, read by `cargo audit` and the Audit workflow
# (.github/workflows/audit.yml). Every ignored advisory needs a written
# reason; remove an entry as soon as the dependency moves past it.
#
# Empty since 2026-11-11: the four zip 4.6.1 advisories (RUSTSEC-2026-0367,
# -0368, -0369, -0429) went with the zip crate itself, which
# tauri-plugin-updater now builds without (crates/oxitide-app/Cargo.toml;
# docs/superpowers/plans/notes/2026-10-27-v1-security-review.md).
[advisories]
ignore = []
